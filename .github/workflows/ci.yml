# Gates every push and PR with the same three checks we run locally:
# prettier formatting, strict typecheck across all workspace packages, and
# the vitest suite. There is no separate lint step — Prettier is the lint
# and tsc is the correctness check (see CLAUDE.md).
name: CI

on:
  push:
    branches: [main]
  # Any base branch, so stacked phase PRs get CI too.
  pull_request:

# Cancel an in-flight run when a new commit lands on the same ref. Keeps
# Actions usage down on PRs that get force-pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format / typecheck / test
    # Pinned: Playwright 1.60 has no Chromium deps for ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    # Real Postgres so the board-object versioning tests run against the
    # actual migrations (they skip when DATABASE_URL is unset).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moodboard
          POSTGRES_PASSWORD: moodboard
          POSTGRES_DB: moodboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moodboard -d moodboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://moodboard:moodboard@localhost:5432/moodboard
    steps:
      - uses: actions/checkout@v4

      # pnpm must be installed BEFORE setup-node so the node action can wire
      # up its store for caching. Version is read from the `packageManager`
      # field in root package.json so local and CI stay in lockstep — bump
      # once, both follow.
      - uses: pnpm/action-setup@v4

      # Node 22 — required by pnpm 11 (uses node:sqlite, a 22.13+ builtin).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The frame renderer and starter-template tests drive a real headless
      # Chromium; without one they skip. Install the build this Playwright
      # version expects (plus its system libraries).
      - name: Install Chromium
        run: pnpm --filter @moodboard/api exec playwright install --with-deps chromium

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Migrate
        run: pnpm --filter @moodboard/api db:migrate

      - name: Test
        run: pnpm test
